# Persora — Cloudflare Workers configuration
# Deploys the Next.js application via OpenNext for Cloudflare.
# Build output is adapted by `opennextjs-cloudflare build` into .worker-next/

name = "persora"
main = ".open-next/worker.js"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding — configured in Cloudflare dashboard or via wrangler
[[d1_databases]]
binding = "DB"
database_name = "persora-db"
database_id = ""  # Set in Cloudflare dashboard after D1 creation

# R2 Bucket binding — configured in Cloudflare dashboard or via wrangler
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "persora-assets"

# Static assets (served by the Worker via env.ASSETS)
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment variables (non-secret)
[vars]
NEXT_PUBLIC_APP_URL = ""
